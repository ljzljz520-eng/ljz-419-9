openapi: 3.0.3
info:
  title: 账号服务 API（account-service）
  version: 1.0.0
  description: >-
    管理医生、护士、管理员账号与 RBAC 权限，负责登录认证与 JWT 签发。
    统一前缀 /api/v1，统一成功/错误响应信封见 docs/standards。
servers:
  - url: http://localhost:3001/api/v1
    description: 本地开发
tags:
  - name: Health
  - name: Auth
  - name: Users

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: account-service }

  /auth/login:
    post:
      tags: [Auth]
      summary: 用户名密码登录，返回 JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/me:
    get:
      tags: [Auth]
      summary: 获取当前登录用户
      responses:
        '200':
          description: 当前用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      summary: 分页查询用户（需 user:read 权限：ADMIN/DOCTOR/NURSE）
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: departmentId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
      responses:
        '200':
          description: 用户分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: 创建用户（仅 ADMIN）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: 查询用户详情（需 user:read）
      responses:
        '200':
          description: 用户详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: 更新用户（仅 ADMIN）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Users]
      summary: 删除用户（仅 ADMIN）
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      deleted: { type: boolean, example: true }
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Role:
      type: string
      enum: [ADMIN, DOCTOR, NURSE]
      description: 管理员 / 医生 / 护士
    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    User:
      type: object
      required: [id, username, fullName, role, departmentId, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, example: doctor1 }
        fullName: { type: string, example: 李医生 }
        role: { $ref: '#/components/schemas/Role' }
        departmentId: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/UserStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    LoginResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            accessToken: { type: string }
            tokenType: { type: string, example: Bearer }
            user: { $ref: '#/components/schemas/User' }
    CreateUserRequest:
      type: object
      required: [username, password, fullName, role]
      properties:
        username: { type: string, minLength: 3, maxLength: 50, pattern: '^[a-zA-Z0-9_.-]+$' }
        password: { type: string, minLength: 8, maxLength: 200 }
        fullName: { type: string, maxLength: 100 }
        role: { $ref: '#/components/schemas/Role' }
        departmentId: { type: string, format: uuid, nullable: true, default: null }
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        password: { type: string, minLength: 8 }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        departmentId: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/UserStatus' }
    UserEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/User' }
    UserPageEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/User' }
            page: { type: integer, example: 1 }
            pageSize: { type: integer, example: 20 }
            total: { type: integer, example: 1 }
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string, example: 请求参数校验失败 }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string, example: password }
                  message: { type: string, example: 密码至少 8 个字符 }
        requestId: { type: string, example: 6f9b2c7e-... }
  responses:
    ValidationError:
      description: 参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidCredentials:
      description: 用户名或密码错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 数据冲突（如用户名重复）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
